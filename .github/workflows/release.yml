name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v26.15.3-ebx.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          shasum -a 256 ebx-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --title "$TAG" \
            --notes "electron-builder $(node -p "require('./VENDOR_VERSIONS.json')['electron-builder']") · node $(node -p "require('./VENDOR_VERSIONS.json').node") — single-binary builds for darwin-arm64, linux-x64, win32-x64. Verify with SHA256SUMS."
